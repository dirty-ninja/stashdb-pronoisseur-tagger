<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="128" height="128">
  <!-- StashDB Tagger for Pronoisseur: the mark from favicon.svg on a dark tile,
       for the README and anywhere the mark stands on its own. The mask must
       stay identical to favicon.svg's. -->
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7AB6"/>
      <stop offset=".5" stop-color="#FF4D9D"/>
      <stop offset="1" stop-color="#F2337F"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2A33"/>
      <stop offset="1" stop-color="#1B1B1E"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#FF4D9D" stop-opacity=".26"/>
      <stop offset="1" stop-color="#FF4D9D" stop-opacity="0"/>
    </radialGradient>
    <mask id="tag" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <g transform="translate(-4.6 -4.6) rotate(45 32 32)">
        <path d="M22 19H49a6 6 0 0 1 6 6V39a6 6 0 0 1-6 6H22L9 32Z"
              fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="18.5" cy="32" r="3.2" fill="#000"/>
      </g>
      <path d="M25 28.5H39M25 35.5H39M30.5 23.5L28.5 40.5M36 23.5L34 40.5"
            fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect width="64" height="64" rx="14" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="13.5" fill="none"
        stroke="#fff" stroke-opacity=".08"/>
  <rect width="64" height="64" fill="url(#pink)" mask="url(#tag)"/>
</svg>
