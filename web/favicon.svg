<svg xmlns="http://www.w3.org/2000/svg" viewBox="7 7 50 50" width="50" height="50">
  <!-- StashDB Tagger for Pronoisseur: a tag with a # through it. The # is both
       halves of the job, the hash that identifies a video and the tags it gets.
       The mark alone, for the browser tab and the top bar. icon.svg sets the
       same mark on a dark tile; its mask must stay identical to this one. -->
  <defs>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7AB6"/>
      <stop offset=".5" stop-color="#FF4D9D"/>
      <stop offset="1" stop-color="#F2337F"/>
    </linearGradient>
    <mask id="tag" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <g transform="translate(-4.6 -4.6) rotate(45 32 32)">
        <path d="M22 19H49a6 6 0 0 1 6 6V39a6 6 0 0 1-6 6H22L9 32Z"
              fill="#fff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="18.5" cy="32" r="3.2" fill="#000"/>
      </g>
      <path d="M25 28.5H39M25 35.5H39M30.5 23.5L28.5 40.5M36 23.5L34 40.5"
            fill="none" stroke="#000" stroke-width="3.2" stroke-linecap="round"/>
    </mask>
  </defs>
  <rect width="64" height="64" fill="url(#pink)" mask="url(#tag)"/>
</svg>
